<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Synchro — Player</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="player.css"></head>
<body><main class="player"><header><div><h1>Synchro <span class="badge">EN → RU</span></h1><p class="small">Control playback here. Keep the source tab open.</p></div><button id="stop" class="secondary">Finish recording</button></header>
<div class="stage" id="stage"><video id="video" playsinline></video><div class="subtitle" hidden><span id="subtitle"></span></div><span id="tempo" class="tempo" hidden></span></div>
<input aria-label="Playback position" type="range" id="seek" class="seek" min="0" max="0" step="0.1" value="0">
<div class="toolbar"><button id="play" disabled>Preparing…</button><span id="position" class="muted">00:00</span><label class="inline-control">Volume<input id="volume" aria-label="Voiceover volume" type="range" min="0" max="100" value="80"></label><label class="check"><input type="checkbox" id="captions"> Captions</label><label class="check"><input type="checkbox" id="original"> Quiet original audio</label><button id="fullscreen" class="secondary">Fullscreen</button></div>
<details class="view-controls"><summary>Picture</summary><div class="toolbar"><label class="inline-control">Zoom<input id="scale" aria-label="Video zoom" type="range" min="50" max="400" value="100"><output id="scaleValue">100%</output></label><button id="fit" class="secondary">Fit</button><button id="fill" class="secondary">Fill</button><label class="check"><input type="checkbox" id="wide">Widescreen</label><span class="muted">Drag the zoomed image to pan</span></div></details>
<div class="status-panel"><span id="status" class="status" role="status">Buffering video and translation…</span><p id="error" class="error" role="alert"></p></div>
<p id="source" class="muted" hidden></p><p class="shortcuts muted">Space — pause · F — fullscreen · C — captions · Double-click video — reset zoom</p></main><script type="module" src="player.js"></script></body></html>
